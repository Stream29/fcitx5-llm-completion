name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libfcitx5core-dev libcurl4-openssl-dev pkg-config g++

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Run core tests
        run: ./gradlew :core:allTests

      - name: Build daemon CLI and C++ addon
        run: make dist

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/fcitx5-llm-completion-daemon-linux-x86_64
            dist/fcitx5-llm-completion-addon-linux-x86_64.tar.gz
